# OmicsExplorer - Cs/Of atlas example
#
#   omicexplorer build -p examples/cs_of/project.yaml
#   omicexplorer serve -p examples/cs_of/project.yaml
#
# The datasets are the Stereo-seq (spatial) and scRNA-seq objects of the
# Clonorchis sinensis / Opisthorchis felineus study.  The files themselves are
# not part of this repository - point `data_root` at the directory that holds
# them (or use the web UI to add your own datasets).

name: Cs/Of Atlas
subtitle: Stereo-seq spatial transcriptomics and scRNA-seq of the liver flukes

# data_root: /path/to/the/directory/with/the/h5ad/files

species:
  cs:
    name: Clonorchis sinensis
    short: Cs
    color: "#4f9cf9"
  of:
    name: Opisthorchis felineus
    short: Of
    color: "#f4a261"

# Canonical cell types, so annotations of different panels can be compared.
ontology:
  cell_types:
    tegument: [tegument, Tegument, L10_tegument]
    parenchyma: [parenchyma, Parenchyma]
    neuron: [neuron, Neuron, Neuronal]
    germline: [germline, oogonia, spermatocyte, spermatogonia, GSC, oocyte]

datasets:
  # ---------------------------------------------------------------- spatial
  - id: cs_bin50
    name: Cs · Stereo-seq bin50
    species: cs
    kind: spatial
    description: >-
      11,387 50 µm bins of adult Clonorchis sinensis, Leiden clusters with
      manual cell-type annotation, UMAP and raw Stereo-seq coordinates.
    path: 2_spatial_Stereo-seq/Cs_FF1.3/Bin50_analysis/Y01087A814.bin50_leiden.rds.h5ad
    gene_details: 20251127_WBPS19_BioMart_export/gene_product_Clonorchis.txt
    units: um
    bin_size: 50
    default_group: cell_type
    default_embedding: spatial
    groups:
      cell_type:
        column: cell_type_manual
        label: Cell type
      cluster:
        column: anno_manual
        label: Cluster
      leiden:
        column: leiden
        label: Leiden
      sample:
        column: orig.ident
        label: Sample
    embeddings:
      spatial:
        kind: spatial
        obsm: spatial
        label: Spatial
      umap:
        kind: umap
        obsm: umap
        label: UMAP
    images:
      - path: website/img/Cs_spatial_HE_adjusted.png
        label: H&E (adjacent section)

  - id: of_cellbin
    name: Of · Stereo-seq cell bin
    species: of
    kind: spatial
    description: >-
      15,127 cell bins of adult Opisthorchis felineus with manual cell-type
      annotation, UMAP and raw Stereo-seq coordinates.
    path: 2_spatial_Stereo-seq/Of_FF1.3/Cellbin_analysis/Y40604K813.cellbin_leiden_annotated.rds.h5ad
    gene_details: 20251127_WBPS19_BioMart_export/gene_product_Opithorchis.txt
    units: um
    default_group: cell_type
    default_embedding: spatial
    groups:
      cell_type:
        column: cell_type_manual
        label: Cell type
      cluster:
        column: anno_manual
        label: Cluster
      leiden:
        column: leiden_manual
        label: Leiden
    embeddings:
      spatial:
        kind: spatial
        obsm: spatial
        label: Spatial
      umap:
        kind: umap
        obsm: umap
        label: UMAP
    images:
      - path: website/img/Of_spatial_HE_adjusted.png
        label: H&E (adjacent section)

  # -------------------------------------------------------------- single cell
  - id: cs_scrna
    name: Cs · scRNA-seq
    species: cs
    kind: umap
    description: >-
      9,633 scRNA-seq profiles of Clonorchis sinensis (RPCA integration),
      annotated cell types and clusters.
    path: 1_scRNA-seq/singlets_filter_analysis/Cs_integrated_RPCA_dim30.h5ad
    default_group: cell_type
    default_embedding: umap.rpca
    groups:
      cell_type:
        column: cell_type
        label: Cell type
      cluster:
        column: anno
        label: Cluster
      seurat_cluster:
        column: seurat_clusters
        label: Seurat cluster
      sample:
        column: orig.ident
        label: Sample
    embeddings:
      umap:
        kind: umap
        obsm: umap.rpca
        label: UMAP (RPCA)
      pca:
        kind: pca
        obsm: pca
        label: PCA
      integrated:
        kind: pca
        obsm: integrated.rpca
        label: RPCA (integrated)

  - id: of_scrna
    name: Of · scRNA-seq
    species: of
    kind: umap
    description: >-
      4,358 scRNA-seq profiles of Opisthorchis felineus (SCT integration),
      annotated cell types and clusters.
    path: 1_scRNA-seq/singlets_filter_analysis/Of_SCT_dim20.h5ad
    default_group: cell_type
    default_embedding: umap
    groups:
      cell_type:
        column: cell_type
        label: Cell type
      cluster:
        column: anno
        label: Cluster
      seurat_cluster:
        column: seurat_clusters
        label: Seurat cluster
      sample:
        column: orig.ident
        label: Sample
    embeddings:
      umap:
        kind: umap
        obsm: umap
        label: UMAP
      pca:
        kind: pca
        obsm: pca
        label: PCA
