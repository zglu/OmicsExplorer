[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsexplorer"
version = "0.1.0"
description = "Local single-cell / spatial-omics visualisation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anndata>=0.10",
    "h5py>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "scipy>=1.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
analysis = ["scanpy>=1.10", "leidenalg>=0.10"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
omicsexplorer = "omicsexplorer.cli:main"

[tool.setuptools]
packages = ["omicsexplorer", "web"]

[tool.setuptools.package-dir]
"web" = "web"

[tool.setuptools.package-data]
"web" = ["index.html", "favicon.svg", "styles/*", "vendor/*", "vendor/**/*.js", "src/**/*.js"]
"omicsexplorer" = ["*.r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
